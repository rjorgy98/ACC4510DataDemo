name: JE Visual Report

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build report
        run: python scripts/build_je_report.py --input je_samples.xlsx --output report_outputs
      - name: Upload report outputs
        uses: actions/upload-artifact@v4
        with:
          name: je-visual-report
          path: report_outputs
