name: JE Sample Summary

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run analysis
        run: python scripts/analyze_je_samples.py --input je_samples.xlsx --output outputs
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: je-sample-summary
          path: outputs
